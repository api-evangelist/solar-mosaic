apis:
- aid: solar-mosaic:solar-mosaic-financing-api
  name: Mosaic Financing API
  description: The Mosaic Financing API is the integration surface Solar Mosaic published for its solar
    installer, dealer and capital partners, documented on a ReadMe-hosted developer portal titled "Mosaic
    Financing API". The portal is password-protected — every path under developer.joinmosaic.com (including
    /reference, /docs and /openapi.json) 302s to /password and returns the ReadMe gate shell — so no public
    reference, operation list or machine-readable contract could be read. The baseURL below is the company-controlled
    API host that resolves and answers (nginx HTTP 503); it is NOT confirmed by documentation, because
    the reference that would confirm it is behind the password gate.
  humanURL: https://developer.joinmosaic.com/
  baseURL: https://api.joinmosaic.com
