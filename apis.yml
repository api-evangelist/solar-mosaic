aid: solar-mosaic
name: Solar Mosaic
description: Solar Mosaic, Inc. (trading as Mosaic) was a residential clean-energy lender founded in Oakland,
  California in 2010, originally as a solar crowdfunding platform and from 2014 as a point-of-sale financing
  platform for residential solar, battery storage and other sustainable home improvements funded through
  third-party capital partners. Mosaic originated loans through a dealer/installer channel and backed
  more than $15 billion in home energy loans across roughly 360,000 households. Its integration surface
  for installer and capital partners was the Mosaic Financing API, documented on a password-protected
  ReadMe developer portal at developer.joinmosaic.com. Solar Mosaic filed for Chapter 11 bankruptcy in
  the Southern District of Texas on 2025-06-09 and its loan portfolio was acquired in September 2025 by
  Solar Servicing LLC, which stated it would not originate new solar loans. As of this profile the joinmosaic.com
  website 301-redirects to solarservicingllc.com, the api.joinmosaic.com host returns HTTP 503, and the
  Mosaic status page reports "Page Inactive".
